services:
  # ─── Frontend (Next.js) ─────────────────────────────────────────────────────
  # Dev:  NODE_ENV=development → `pnpm next dev` on :3000 (source bind-mounted)
  # Prod: NODE_ENV=production  → http-server serving /app/out (static export)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        BUILD_STATIC: ${BUILD_STATIC:-1}
        DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASS:-postgres}@postgresql:5432/${PG_DB:-postgres}?sslmode=disable
    image: skygenesisenterprise/aether-identity:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    command: server
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_PORT: "3000"
      API_INTERNAL_URL: http://worker:8080/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_REALTIME_URL: /api/v1/realtime/ws
      NEXT_PUBLIC_USE_PLATFORM_MOCKS: ${NEXT_PUBLIC_USE_PLATFORM_MOCKS:-false}
      HTTP_ACCESS_LOGS: ${HTTP_ACCESS_LOGS:-false}
    volumes:
      - ./apps:/app/apps
      - /app/apps/node_modules
      - /app/apps/.next
      - ./entrypoint.sh:/entrypoint.sh
      - certs:/certs
      - custom-templates:/templates
    depends_on:
      worker:
        condition: service_started
    networks:
      - aether-identity

  # ─── API / worker (Go) ──────────────────────────────────────────────────────
  # Dev:  WORKER_COMMAND=air    → hot-reload via Air (:8080)
  # Prod: WORKER_COMMAND=worker → compiled binary, mode `worker` (:8080)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        BUILD_STATIC: ${BUILD_STATIC:-1}
        DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASS:-postgres}@postgresql:5432/${PG_DB:-postgres}?sslmode=disable
    image: skygenesisenterprise/aether-identity:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    command: ${WORKER_COMMAND:-air}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      start_period: ${WORKER_START_PERIOD:-180s}
      interval: 5s
      retries: 10
      timeout: 5s
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      USE_EMBEDDED_DB: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # GORM AutoMigrate (server/main.go) is the single schema owner.
      # prisma db push --accept-data-loss was dropping/recreating the
      # collections status/type/visibility/metadata_status columns on every
      # boot (GORM stores them as text, Prisma expects enums), wiping data.
      PRISMA_SCHEMA_DEPLOY: "false"
      PRISMA_SCHEMA_DEPLOY_STRATEGY: ${PRISMA_SCHEMA_DEPLOY_STRATEGY:-push}
      ALLOW_MIGRATION_FAILURE: ${ALLOW_MIGRATION_FAILURE:-false}
      REDIS_ENABLED: "true"
      REDIS_REQUIRED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
      REDIS_DB: "0"
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis-dev-password}@redis:6379/0
      REDIS_KEY_PREFIX: aether-calendar:v1
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-skygenesisenterprise}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.calendar.skygenesisenterprise.localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://calendar.skygenesisenterprise.localhost,http://api.calendar.skygenesisenterprise.localhost,http://sso.skygenesisenterprise.localhost,http://studios.aether-calendar.localhost,http://media.aether-calendar.localhost,http://data.aether-calendar.localhost,http://rabbitmq.aether-calendar.localhost,http://search.aether-calendar.localhost,http://localhost:3000,http://127.0.0.1:8081}
      LISTEN__TRUSTED_PROXY_CIDRS: 0.0.0.0/0,::/0
      API_PORT: "8080"
      HOST: ${DOMAIN_HOST:-calendar.skygenesisenterprise.localhost}
      POSTGRESQL__HOST: postgresql
      POSTGRESQL__PORT: "5432"
      POSTGRESQL__USER: ${PG_USER:-postgres}
      POSTGRESQL__NAME: ${PG_DB:-postgres}
      POSTGRESQL__PASSWORD: ${PG_PASS:-postgres}
      DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASS:-postgres}@postgresql:5432/${PG_DB:-postgres}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
    volumes:
      - ./server:/app/server
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./entrypoint.sh:/entrypoint.sh
      - ./.air.toml:/app/.air.toml
      - gopkg:/go/pkg
      - certs:/certs
      - custom-templates:/templates
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - aether-identity

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  # Runs through the unified entrypoint (`command: postgresql`); applies the
  # Prisma schema on boot and watches for changes when PRISMA_HOT_RELOAD=true.
  postgresql:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        BUILD_STATIC: ${BUILD_STATIC:-1}
    image: skygenesisenterprise/aether-identity:${APP_IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    command: postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/prisma/schema.prisma:/app/server/prisma/schema.prisma:ro
      - ./server/prisma/package.json:/app/server/prisma/package.json:ro
      - ./infrastructure/docker/deploy-schema.sh:/usr/local/bin/deploy-schema.sh:ro
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:-postgres}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_DB: ${PG_DB:-postgres}
      DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASS:-postgres}@localhost:5432/${PG_DB:-postgres}
      # Schema ownership is delegated to GORM AutoMigrate (see worker). Prisma
      # auto-deploy is disabled to stop db push from resetting collection
      # status/type/visibility columns on every container start.
      PRISMA_SCHEMA_DEPLOY: "false"
      PRISMA_SCHEMA_DEPLOY_STRATEGY: ${PRISMA_SCHEMA_DEPLOY_STRATEGY:-push}
      PRISMA_MIGRATE_DEPLOY: "false"
      PRISMA_HOT_RELOAD: "false"
      PRISMA_POLL_INTERVAL: ${PRISMA_POLL_INTERVAL:-5}
      ALLOW_MIGRATION_FAILURE: "true"
    expose:
      - "5432"
    networks:
      - aether-identity

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD:-redis-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
    expose:
      - "6379"
    networks:
      - aether-identity

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 10s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - ${RABBITMQ_AMQP_PORT:-5672}:5672
      - ${RABBITMQ_MGMT_PORT:-15672}:15672
    networks:
      - aether-identity

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.7
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      start_period: 10s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - meilisearch-data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      MEILI_ENV: ${MEILI_ENV:-development}
    ports:
      - ${MEILI_PORT:-7700}:7700
    networks:
      - aether-identity

  # ─── Dev-only services (enable with: docker compose --profile dev up) ────────

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - ${DEV_HTTP_BIND_HOST:-0.0.0.0}:${DEV_HTTP_PORT:-80}:80
    volumes:
      - ./infrastructure/web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_started
      worker:
        condition: service_healthy
    networks:
      - aether-identity

  postgres-data:
    image: docker.io/dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@skygenesisenterprise.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infrastructure/docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    expose:
      - "80"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - aether-identity

volumes:
  postgres-data:
  redis-data:
  gopkg:
  certs:
  custom-templates:
  rabbitmq-data:
  meilisearch-data:
  pgadmin-data:
  uptime-kuma-data:
  cdn-data:

networks:
  aether-identity:
    driver: bridge