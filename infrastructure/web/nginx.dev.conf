resolver 127.0.0.11 ipv6=off valid=30s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Nginx status ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name proxy.skygenesisenterprise.localhost proxy.skygenesisenterprise.lan;

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }
}

# ─── MeiliSearch ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name search.skygenesisenterprise.localhost search.skygenesisenterprise.lan;

    client_max_body_size 50m;

    location / {
        proxy_pass http://meilisearch:7700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# ─── Go API (worker) ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.calendar.skygenesisenterprise.localhost api.calendar.skygenesisenterprise.lan;

    client_max_body_size 50m;

